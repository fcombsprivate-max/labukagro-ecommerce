[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Direct all /api/* requests to the unified serverless API function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Single Page App routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
